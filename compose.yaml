# docker compose up --build  →  http://localhost:8000
# Kunci AI (OPENROUTER_API_KEY, GEMINI_API_KEY) diambil dari .env bila ada.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: jdih
    DB_USERNAME: postgres
    DB_PASSWORD: root
    PDFTOTEXT_BIN: pdftotext
    PDFTOPPM_BIN: pdftoppm
    TESSERACT_BIN: tesseract
  volumes:
    - storage:/app/storage/app/private
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "8000:8000"

  # Cadangan harian 01:00 dan pengingat masa berlaku 07:00.
  jadwal:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jdih
      POSTGRES_PASSWORD: root
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20

volumes:
  db:
  storage:
